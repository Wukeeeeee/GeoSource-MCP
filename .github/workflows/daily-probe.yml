name: Daily GIS Health Probe

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 08:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Sample Endpoint Liveness Probe
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Sample Endpoint Probe
        run: |
          python scripts/daily_probe.py --sample 30 --output-md probe_summary.md

      - name: Publish Health Report to Job Summary
        if: always()
        run: |
          if [ -f probe_summary.md ]; then
            cat probe_summary.md >> $GITHUB_STEP_SUMMARY
          fi
